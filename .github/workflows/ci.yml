name: Target Degradation Protac Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,dev]"
        python -m pip check

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check Python syntax
      run: python -m compileall -q agents protac_designer cli.py simulator.py enrichment.py

    - name: Check high-severity Python lint issues
      run: ruff check --select E4,E7,E9,F63,F7,F82 .

    - name: Check browser JavaScript
      run: |
        node --check web/app.js
        node --test tests/test_web_app.cjs

    - name: Audit chain and privacy regression smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
