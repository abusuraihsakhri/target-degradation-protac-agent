[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "target-degradation-protac-engine"
version = "2.0.0"
description = "PROTAC-Designer: Heterobifunctional Degrader Linker & Ternary Complex Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
target-degradation-protac-engine = "protac_designer.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/target-degradation-protac-engine"
Repository = "https://github.com/abusuraihsakhri/target-degradation-protac-engine.git"
