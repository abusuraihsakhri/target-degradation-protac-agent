[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "target-degradation-protac-engine"
version = "2.0.0"
description = "Deterministic metric screening tools with rule-based audit workflows"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
target-degradation-protac-engine = "protac_designer.cli:main"
target-degradation-protac-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "protac_designer_app"]

[tool.setuptools.packages.find]
include = ["agents*", "protac_designer*"]
namespaces = false

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/target-degradation-protac-agent"
Repository = "https://github.com/abusuraihsakhri/target-degradation-protac-agent.git"
